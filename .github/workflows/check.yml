# Checks for every pull request (forks included) and every push to main.
# Read-only token, no secrets: pull request code never gets credentials.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types, lint, tests, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Every run summary recomputes from its records
        run: node runner/src/cli.ts summarize results --check

  submission:
    # A pull request that adds results must be signed, and only the record-submissions
    # workflow writes submissions/ (after merge), so nobody can claim someone else's run.
    name: signed results, no edits to submissions/
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if grep -q '^submissions/' <<<"$files"; then
            echo "::error::submissions/ is written after merge by the record-submissions workflow. Remove those changes from this pull request."
            exit 1
          fi
          if ! grep -q '^results/' <<<"$files"; then
            echo "No results in this pull request; nothing to verify."
            exit 0
          fi
          bad=0
          for sha in $(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[].sha'); do
            info=$(gh api "repos/$REPO/commits/$sha" --jq '"\([.files[].filename | select(startswith("results/"))] | length) \(.commit.verification.verified) \(.commit.verification.reason)"')
            read -r touches verified reason <<<"$info"
            [ "$touches" = 0 ] && continue
            if [ "$verified" = true ]; then
              echo "commit ${sha:0:7}: adds results, signature verified by GitHub"
            else
              echo "::error::commit ${sha:0:7} adds results but GitHub did not verify a signature ($reason). See CONTRIBUTING.md, 'Sign your commits'."
              bad=1
            fi
          done
          exit $bad
