name: typed-decisions
status: ready
description: >-
  Hugging Face official benchmark (LocalLLaMA/typed-decisions): one state and five typed
  System One questions per case; gold answers are probability distributions.
protocol: decision            # the System One /v1/systemone shape
category: decisions
license: Apache-2.0
dataset:
  repo: LocalLLaMA/typed-decisions
  revision: d0e2f0c42fef86cc15d1688d25a19f5ba7c85b18   # main as of 2026-10-01
  workflows: [agent_trace_observability, customer_service, invoice_processing, security_incidents]
  files:
    agent_trace_observability/test-00000-of-00001.parquet: 833ad1364237b9a3fe05be2c62e632f0cb34ba372284b975140d362ab246f70d
    customer_service/test-00000-of-00001.parquet: b4e6e23b3c2add197dda74008f2ce42ff996511ff1bf9c93e8b0e6d84ac9c275
    invoice_processing/test-00000-of-00001.parquet: ce2adfb5201dba910b23bda6ab9678c385b580edaabbf8348b4e024c120d4b75
    security_incidents/test-00000-of-00001.parquet: 4d8bc1879a0b67e5d275edea21a694b06136ca2a2c3355215a7d8adea6b0c75f
  # train is read only by `bench calibrate` to rebuild the card's Prior baseline; never sent to a subject.
  train_files:
    agent_trace_observability/train-00000-of-00001.parquet: e7b2f78fe539517c6a66a90c68ed671c6133194a88d27dbff5d84713af46b901
    customer_service/train-00000-of-00001.parquet: 3e3abc2a9307bc641f60a6f9042627897ca01c145c3206211dfa9c926ba8721c
    invoice_processing/train-00000-of-00001.parquet: 6a5cfcd12e77e707cd9861107868a5adbb7df566ced3162bb9472cd3e348a598
    security_incidents/train-00000-of-00001.parquet: 3aae379ac25fc6434d5f5675f04b06f4310d1aac3056a0e30bb0f779aa2f0a99
request: >-
  Each case is sent whole, state plus all five questions, in one request, exactly as the
  dataset stores them (the card's own protocol; request shape changes scores).
tiers:
  quick: {ids: quick.ids, note: 25 cases per workflow, seeded and stratified; 500 decisions}
  core: {ids: core.ids, note: the whole test split; 400 cases, 2000 decisions}
scoring:
  version: 1
  accuracy: "argmax of the predicted distribution against the gold label; ties go to the first option in the gold's option order. Invalid or missing answers count as wrong."
  kl_from_gold: "mean over decisions of sum_o gold(o) * ln(gold(o) / max(pred(o), 1e-12))"
  brier: "mean over decisions of sum_o (pred(o) - gold(o))^2, against the gold distribution"
  ece: "10 equal-width bins of top-label confidence (max predicted probability) against hard correctness"
  noul: "the answer p becomes the distribution {false: 1 - p, true: p}"
  tolerance: "a distribution summing to within 0.01 of 1 is renormalized; anything else is invalid"
  over: "accuracy counts every dispatched decision; kl, brier and ece use valid decisions only, with n reported"
calibration:
  # The card's own baselines, rebuilt offline by `bench calibrate typed-decisions`.
  # KL and Brier reproduce exactly. Accuracy differs on Prior by 5 of 2000 decisions.
  # The card does not define ECE (it says submitters compute it differently), so ECE is not comparable.
  card:
    uniform: {accuracy: 0.308, kl_from_gold: 0.444, brier: 0.238, ece: 0.169}
    prior: {accuracy: 0.470, kl_from_gold: 0.347, brier: 0.189, ece: 0.088}
  reference_rows:
    jev-1.13.0: {accuracy: 0.727, kl_from_gold: 1.442, brier: 0.148, ece: 0.144, measured: 2026-09-18, by: dataset card, items: core}
