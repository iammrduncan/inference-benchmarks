# Model × machine combinations that were asked for but cannot run, with the reason. The site shows
# these in the model matrix instead of leaving the cell blank. Add a line only after checking.
- model: gev-26b-decide
  class: "p100:p100"
  label: NVIDIA P100 · 16 GB
  reason: "26B MoE: 51 GB in bf16. bitsandbytes quantizes nn.Linear only, and transformers stores the routed experts (about 46 GB) as fused tensors, so they stay 16-bit. vLLM (the official path) and FP4/Marlin kernels need sm_80+. No route without a custom llama.cpp build plus a hand-applied decision head."